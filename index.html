window.addEventListener('resize',resizeCanvas);
function getNodeAt(cx,cy){const r=canvas.getBoundingClientRect();const mx=(cx-r.left-panX)/zoom,my=(cy-r.top-panY)/zoom;for(let t in ABILITIES_DATA)for(let k in ABILITIES_DATA[t]){const a=ABILITIES_DATA[t][k];if(!isNodeVisible(a))continue;const b=a._bounds;if(b&&mx>=b.x&&mx<=b.x+b.width&&my>=b.y&&my<=b.y+b.height)return a;}return null;}
function drawCorner(x,y,sym){const s=26,cx=x+6,cy=y+6;ctx.save();ctx.fillStyle='#111';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(cx,cy,s,s,6);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 16px "Segoe UI"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sym,cx+s/2,cy+s/2+1);ctx.restore();}
function drawRegionsScreen(){
  const types=[];for(const t in AI_NAMES){if(t===gameState.selectedType){types.push(t);continue;}const cross=findCrossBetween(gameState.selectedType,t);if(cross&&gameState.unlockedAbilities[cross.id])types.push(t);}
  if(!types.length)return;
  const hl=getHighlightedTypes();
  const centers={};for(const t of types){let sum=0,cnt=0;for(let k in ABILITIES_DATA[t]){sum+=ABILITIES_DATA[t][k].x;cnt++;}centers[t]=cnt?sum/cnt:0;}types.sort((a,b)=>centers[a]-centers[b]);const toSX=wx=>wx*zoom+panX;const edges=[0];for(let i=0;i<types.length-1;i++)edges.push(toSX((centers[types[i]]+centers[types[i+1]])/2));edges.push(canvas.width);
  for(let i=0;i<types.length;i++){
    const t=types[i],l=edges[i],r=edges[i+1];const active=hl.has(t);
    ctx.fillStyle=hexToRgba(AI_COLORS[t]||'#888',active?0.12:0.05);ctx.fillRect(l,0,r-l,canvas.height);
    if(i<types.length-1){ctx.strokeStyle=hexToRgba(AI_COLORS[types[i+1]]||'#888',active?0.7:0.4);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(r,canvas.height);ctx.stroke();}
    ctx.fillStyle=hexToRgba(AI_COLORS[t]||'#888',active?0.9:0.5);ctx.font=(active?'bold ':'')+'26px "Segoe UI"';ctx.textAlign='center';ctx.fillText(AI_NAMES[t]+' ИИ',(l+r)/2,44);
  }
}
function draw(now){
  now=now||performance.now();
  const pulse=(Math.sin(now/250)+1)/2;
  ctx.clearRect(0,0,canvas.width,canvas.height);drawRegionsScreen();
  ctx.save();ctx.translate(panX,panY);ctx.scale(zoom,zoom);
  const all=[];for(let t in ABILITIES_DATA)for(let k in ABILITIES_DATA[t])all.push(ABILITIES_DATA[t][k]);
  const hx=(canvas.width/2-panX)/zoom,hy=(0-panY)/zoom;
  ctx.save();ctx.lineWidth=2;ctx.setLineDash([6,4]);for(const a of all){if(!a.isMain||a.aiType!==gameState.selectedType)continue;ctx.strokeStyle=hexToRgba(AI_COLORS[a.aiType]||'#ffd700',0.5);const hyLine=hy+8;ctx.beginPath();ctx.moveTo(a.x,a.y-60);ctx.lineTo(a.x,hyLine);ctx.lineTo(hx,hyLine);ctx.lineTo(hx,hy);ctx.stroke();}ctx.setLineDash([]);ctx.restore();
  for(const a of all){if(!isNodeVisible(a))continue;const childLocked=!gameState.unlockedAbilities[a.id]&&!canUnlockAbility(a.id);const la=childLocked?0.12:0.35;const bc=AI_COLORS[a.aiType]||'#4488ff';
    if(a.parent){const p=getAbility(a.parent);if(p&&isNodeVisible(p)){const foreignLink=p.aiType!==gameState.selectedType;ctx.strokeStyle=foreignLink?`rgba(255,68,68,${la})`:hexToRgba(bc,la);ctx.lineWidth=a.isCrossAbility?2.5:2;ctx.setLineDash(foreignLink?[6,4]:[]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(a.x,a.y);ctx.stroke();ctx.setLineDash([]);}}
    if(a.crossParent){const cp=getAbility(a.crossParent);if(cp&&isNodeVisible(cp)){const foreignLink=cp.aiType!==gameState.selectedType;ctx.strokeStyle=`rgba(255,68,255,${la})`;ctx.lineWidth=2.5;ctx.setLineDash(foreignLink?[6,4]:[]);ctx.beginPath();ctx.moveTo(cp.x,cp.y);ctx.lineTo(a.x,a.y);ctx.stroke();ctx.setLineDash([]);}}}
  for(const a of all){
    if(!isNodeVisible(a)){a._bounds=null;continue;}
    const un=gameState.unlockedAbilities[a.id],isCore=a.isMain,isCross=a.isCrossAbility;
    const f=reqFlags(a.id);const levelMet=f.levelMet,fullCan=f.allMet;
    const fc=isCore&&a.aiType!==gameState.selectedType&&!un;
    const locked=!un&&!levelMet;
    const al=gameState.teraflops.allocation[a.id]||0,ll=gameState.abilitiesProgress[a.id]?.currentLevel||0;
    const bc=AI_COLORS[a.aiType]||'#888888';const active=un&&al>0;
    const w=isCore?150:(isCross?130:120),h=w;const x=a.x-w/2,y=a.y-h/2;
    let sc,sw,da=false;
    if(fc||locked){sc='#666';sw=2;da=true;}
    else if(isCross){sc='#ff44ff';sw=active?3:2;}
    else if(un){sc=bc;sw=(active||isCore)?3:2;}
    else{sc=bc;sw=2;}
    if(fc||locked)ctx.fillStyle='rgba(40,40,40,0.5)';else if(isCore){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,hexToRgba(bc,0.28));g.addColorStop(1,hexToRgba(bc,0.10));ctx.fillStyle=g;}else if(isCross){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'rgba(50,10,30,0.95)');g.addColorStop(1,'rgba(30,5,40,0.95)');ctx.fillStyle=g;}else ctx.fillStyle='rgba(15,15,35,0.9)';
    ctx.strokeStyle=sc;ctx.lineWidth=sw;ctx.setLineDash(da?[6,4]:[]);
    ctx.beginPath();ctx.roundRect(x,y,w,h,10);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    if(locked&&a.parent){const up=unlockProgressOf(a);if(up>0.02){ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,10);ctx.clip();const fh=h*up;ctx.fillStyle=hexToRgba(bc,0.22);ctx.fillRect(x,y+h-fh,w,fh);ctx.fillStyle=hexToRgba(bc,0.6);ctx.fillRect(x,y+h-fh-1,w,2);ctx.restore();}}
    if(!un){ if(levelMet){ drawCorner(x,y,'+'); if(fullCan){ctx.save();ctx.shadowColor=bc;ctx.shadowBlur=8+12*pulse;ctx.strokeStyle=bc;ctx.lineWidth=2+1.5*pulse;ctx.beginPath();ctx.roundRect(x-3,y-3,w+6,h+6,12);ctx.stroke();ctx.restore();} } else drawCorner(x,y,'🔒'); }
    else if(ll>=a.maxLevel)drawCorner(x,y,'✓');
    if(isCross){ctx.strokeStyle='#ff4444';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x+3,y+3,w-6,h-6,8);ctx.stroke();}
    if(a.id===currentOpenAbility){ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.shadowColor='rgba(255,255,255,0.9)';ctx.shadowBlur=10;ctx.beginPath();ctx.roundRect(x-6,y-6,w+12,h+12,12);ctx.stroke();ctx.restore();}
    ctx.save();ctx.globalAlpha=active?1:0.35;ctx.font=`${isCore?56:44}px "Segoe UI"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.icon||'❓',a.x,y+h*0.42);ctx.restore();
    const n=a.maxLevel,spacing=22,r=7;const totalW=(n-1)*spacing;
    for(let i=0;i<n;i++){const lvl=i+1;const cx=a.x-totalW/2+i*spacing;const cy=y+h-16;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);if(lvl<=al){ctx.fillStyle=bc;ctx.fill();}else if(lvl<=ll){ctx.strokeStyle=bc;ctx.lineWidth=3;ctx.stroke();}else{ctx.strokeStyle='#666';ctx.lineWidth=2;ctx.stroke();}}
    a._bounds={x,y,width:w,height:h};
  }
  for(const imp of impulses){const p=impulsePos(imp);ctx.save();ctx.shadowColor=imp.color;ctx.shadowBlur=16;ctx.fillStyle=imp.color;ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();ctx.restore();}
  ctx.restore();
}
function mainLoop(now){
  const dt=(now-lastFrame)/1000;lastFrame=now;
  for(const imp of impulses)imp.dist+=imp.speed*dt;
  impulses=impulses.filter(i=>i.dist<i.total);
  draw(now);
  requestAnimationFrame(mainLoop);
}
requestAnimationFrame(t=>{lastFrame=t;mainLoop(t);});
canvas.addEventListener('mousedown',e=>{const n=getNodeAt(e.clientX,e.clientY);if(n){if(n.isMain&&n.aiType!==gameState.selectedType){addNotification(`Уже выбран ${AI_NAMES[gameState.selectedType]} ИИ`,'warning');return;}gameState.seenAbilities.add(n.id);openAbilityPanel(n.id);focusOnAbility(n);}else{isDragging=true;lastMouseX=e.clientX;lastMouseY=e.clientY;canvas.style.cursor='grabbing';}});
canvas.addEventListener('mousemove',e=>{if(isDragging){panX+=e.clientX-lastMouseX;panY+=e.clientY-lastMouseY;lastMouseX=e.clientX;lastMouseY=e.clientY;}else{const n=getNodeAt(e.clientX,e.clientY);hoverAbilityId=n?n.id:null;if(n){showTooltip(nodeTip(n),e.clientX,e.clientY);canvas.style.cursor=(n.isMain&&n.aiType!==gameState.selectedType)?'not-allowed':'pointer';}else{hideTooltip();canvas.style.cursor='grab';}}});
canvas.addEventListener('mouseup',()=>{isDragging=false;canvas.style.cursor='grab';});
canvas.addEventListener('mouseleave',()=>{hideTooltip();hoverAbilityId=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.5,Math.min(2,zoom*(e.deltaY<0?1.1:0.9)));});
// СТАРТ: префилл-сценарий, открываем X = Экономический шантаж
updateTeraflopsUsed();
currentOpenAbility='amoral_extortion';
updateUI();draw();startProgressTimer();
setTimeout(()=>{focusOnAbility(getAbility('amoral_extortion'));openAbilityPanel('amoral_extortion');
  addNotification('🎯 Задание 1: поднимите уровень «Экономический шантаж» — не хватит флопсов.','warning');
  addNotification('💡 Задание 2-3: освободите TF у другой способности (опустите её уровень), затем поднимите «Х» снова.','info');
},80);
resizeCanvas();
</script>
