    if(locked||fc)ctx.fillStyle='rgba(40,40,40,0.5)';
    else if(isCore){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,hexToRgba(bc,0.28));g.addColorStop(1,hexToRgba(bc,0.10));ctx.fillStyle=g;}
    else if(isCross){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'rgba(50,10,30,0.95)');g.addColorStop(1,'rgba(30,5,40,0.95)');ctx.fillStyle=g;}
    else ctx.fillStyle='rgba(15,15,35,0.9)';
    ctx.strokeStyle=sc;ctx.lineWidth=sw;ctx.setLineDash(da?[6,4]:[]);
    ctx.beginPath();ctx.roundRect(x,y,w,h,10);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    if(isCross){ctx.strokeStyle='#ff4444';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x+3,y+3,w-6,h-6,8);ctx.stroke();}
    if(a.id===currentOpenAbility){ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.shadowColor='rgba(255,255,255,0.9)';ctx.shadowBlur=10;ctx.beginPath();ctx.roundRect(x-6,y-6,w+12,h+12,12);ctx.stroke();ctx.restore();}
    ctx.save();ctx.globalAlpha=active?1:0.35;ctx.font=`${isCore?56:44}px "Segoe UI"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.icon||'❓',a.x,y+h*0.42);ctx.restore();
    const n=a.maxLevel,spacing=22,r=7;const totalW=(n-1)*spacing;
    for(let i=0;i<n;i++){const lvl=i+1;const cx=a.x-totalW/2+i*spacing;const cy=y+h-16;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);if(lvl<=al){ctx.fillStyle=bc;ctx.fill();}else if(lvl<=ll){ctx.strokeStyle=bc;ctx.lineWidth=3;ctx.stroke();}else{ctx.strokeStyle='#666';ctx.lineWidth=2;ctx.stroke();}}
    if(locked)drawCorner(x,y,'🔒');else if(!un&&cu)drawCorner(x,y,'+');else if(un&&ll>=a.maxLevel)drawCorner(x,y,'✓');
    a._bounds={x,y,width:w,height:h};
  }
  ctx.restore();
}
canvas.addEventListener('mousedown',e=>{stopPanAnim();const n=getNodeAt(e.clientX,e.clientY);if(n){if(n.isMain&&n.aiType!==gameState.selectedType){addNotification(`Уже выбран ${AI_NAMES[gameState.selectedType]} ИИ`,'warning');return;}gameState.seenAbilities.add(n.id);openAbilityPanel(n.id);focusOnAbility(n);}else{isDragging=true;lastMouseX=e.clientX;lastMouseY=e.clientY;canvas.style.cursor='grabbing';}});
canvas.addEventListener('mousemove',e=>{if(isDragging){panX+=e.clientX-lastMouseX;panY+=e.clientY-lastMouseY;lastMouseX=e.clientX;lastMouseY=e.clientY;draw();}else{const n=getNodeAt(e.clientX,e.clientY);if(n){showTooltip(nodeTip(n),e.clientX,e.clientY);canvas.style.cursor=(n.isMain&&n.aiType!==gameState.selectedType)?'not-allowed':'pointer';}else{hideTooltip();canvas.style.cursor='grab';}}});
canvas.addEventListener('mouseup',()=>{isDragging=false;canvas.style.cursor='grab';});
canvas.addEventListener('mouseleave',()=>{hideTooltip();});
canvas.addEventListener('wheel',e=>{e.preventDefault();stopPanAnim();zoom=Math.max(0.5,Math.min(2,zoom*(e.deltaY<0?1.1:0.9)));draw();});
resizeCanvas();
</script>
